# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.ruff]
src_dirs = ["src", "scripts"]


[processor.mypy]
src_dirs = ["src", "scripts"]

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# The Makefile compiled each *.hs into an executable with `ghc -v0 -o x.elf x.hs`.
# The generator drives scripts/ghc_build.py, which does the same and points ghc's
# .hi/.o intermediates at the output dir instead of the source tree.
[processor.generator.haskell]
command = "scripts/ghc_build.py"
src_dirs = ["src"]
src_extensions = [".hs"]
output_dir = "out"
output_extension = "elf"
batch = false

# ghc compiles the demos.
[dependencies]
system = [
    "ghc",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]
